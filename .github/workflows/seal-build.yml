# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'go test arguments (e.g. -run TestFoo ./html/) to run instead of ./...'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have (upstream ships no .github).
      # .gitignore and .gitattributes are kept: they ARE part of the published
      # module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # cache: false so a restored GOCACHE can never replay `(cached)` test
      # results — every run executes the suite afresh.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build
        run: |
          set -eux
          go build ./...

      # -v so every test reports its own PASS/FAIL/SKIP line (a SKIP line is
      # followed by the t.Skip reason); the summary at the end states how many
      # tests passed. The exit status of `go test` is propagated unchanged.
      - name: Test
        run: |
          set -euo pipefail
          go test -v ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Lists every skipped test together with the t.Skip message it logged
      # (the indented `<file>_test.go:<line>: <reason>` lines emitted between
      # its `=== RUN`/`=== CONT` and its `--- SKIP`), then the totals.
      - name: Test summary
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^=== (RUN|CONT|NAME)[ \t]/ { cur = $3; msg[cur] = "" }
            /^[ \t]+[^ \t]+\.go:[0-9]+: / { r = $0; sub(/^[ \t]+/, "", r); msg[cur] = (msg[cur] == "" ? r : msg[cur] " | " r) }
            /^[ \t]*--- SKIP: / {
              n = $3
              why = (n in msg && msg[n] != "") ? msg[n] : "(skipped without a message; see the test source)"
              skipped[++ns] = "SKIPPED " n " -- " why
            }
            /^(ok|FAIL|\?)[ \t]/ { print }
            /^ok[ \t]/ { pok++ }
            /^FAIL[ \t]/ { pfail++ }
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ { skip++ }
            END {
              print "==== skipped tests and reasons ===="
              for (i = 1; i <= ns; i++) print skipped[i]
              print "==== go test summary ===="
              printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
              printf "tests passed: %d, failed: %d, skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.log"
